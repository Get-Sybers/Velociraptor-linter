name: Linter.Artefacts
author: "Velociraptor Linter"
description: |
  The artefact standard as VQL: lints every artefact and doc
  companion under the given trees and reports one row per finding (Path,
  Line, Rule, Severity, Message). Run by make vql-lint through the pinned
  Velociraptor release; the rule table is the appendix of the standard and
  tests/lint holds the fixtures every rule must flag. When editing a rule:
  VQL regexes are case-insensitive unless they start with (?-i), a list of
  dicts given to foreach() spreads each dict's keys as columns (there is no
  _value), the literal text "Artifact." followed by a name is read as an
  artefact dependency wherever it appears, strings included, and a run-time
  error inside the export yields no findings and no message, so a new rule
  is first run standalone (the export body with Root, Paths, Strict and
  Reference as LETs) until it is clean.
type: SERVER

reference:
  - https://docs.velociraptor.app/vql_reference/other/verify/
  - https://docs.velociraptor.app/vql_reference/server/artifact_definitions/

parameters:
  - name: Root
    description: Absolute path of the repository checkout.
    default: ""
  - name: Paths
    description: Trees or files to lint, relative to Root, one per row.
    type: json_array
    default: '["Dev", "Prod"]'
  - name: Strict
    description: Treat warnings as errors everywhere, not only under Prod/.
    type: bool
    default: "N"
  - name: Reference
    description: Absolute path of Velociraptor's VQL reference (docs/references/vql.yaml in the pinned source), the list of plugins and functions the improper-method rules check against; empty skips them.
    default: ""

export: |
  LET AP = "Artifact" + "."
  LET RootN = len(list=pathspec(parse=Root).Components)
  LET Sev(Env) = if(condition=Strict OR Env = "Prod", then="error", else="warning")
  LET Trim(S) = regex_replace(source=S, re="^\\s+|\\s+$", replace="")
  LET IsStr(V) = typeof(a=V) = "string"
  LET IsDict(V) = typeof(a=V) =~ "Dict"
  LET IsList(V) = typeof(a=V) =~ "\\[\\]"
  LET Keys(D) = items(item=D)._key

  LET PathGlobs <= SELECT _value + "/**" AS G FROM foreach(row=Paths)
  LET Files <= SELECT OSPath,
         join(array=OSPath.Components[RootN:], sep="/") AS Rel,
         read_file(filename=OSPath) AS Text
    FROM chain(a={ SELECT OSPath, IsDir FROM glob(globs=Paths, root=Root) },
               b={ SELECT OSPath, IsDir FROM glob(globs=PathGlobs.G, root=Root) })
    WHERE NOT IsDir AND OSPath.Basename =~ "(?-i)\\.ya?ml$"
    GROUP BY Rel
  LET FileSet <= memoize(query={ SELECT Rel FROM Files }, key="Rel")

  LET Stem(Base, IsDoc) = if(condition=IsDoc,
       then=regex_replace(source=Base, re="(?-i)^doc|\\.yml$", replace="") + ".Doc",
       else=regex_replace(source=Base, re="(?-i)\\.yaml$", replace=""))
  LET ExpectedName(Comps, Base, IsDoc) = if(condition=len(list=Comps) > 3,
       then=join(array=Comps[2:-1], sep=".") + "." + Stem(Base=Base, IsDoc=IsDoc),
       else=Stem(Base=Base, IsDoc=IsDoc))
  LET LayoutOK(Comps) = len(list=Comps) >= 3 AND Comps[0] =~ "(?-i)^(Dev|Prod)$" AND Comps[1] =~ "(?-i)^(Client|Server|Notebooks)$"

  LET Parsed <= SELECT Rel, Text, OSPath.Basename AS Base,
         OSPath.Basename =~ "(?-i)^doc.*\\.yml$" AS IsDoc,
         split(string=Rel, sep="/") AS Comps,
         split(string=Rel, sep="/")[0] AS Env,
         split(string=Rel, sep="/")[1] AS Kind,
         parse_yaml(filename=Text, accessor="data") AS Y
    FROM Files
  LET Arts <= SELECT Rel, Text, Base, IsDoc, Comps, Env, Kind, Y,
         Y.name AS Name,
         if(condition=Y.type, then=upcase(string=str(str=Y.type)), else="CLIENT") AS TypeU,
         LayoutOK(Comps=Comps) AS LayoutIsOK,
         ExpectedName(Comps=Comps, Base=Base, IsDoc=IsDoc) AS Expected
    FROM Parsed WHERE IsDict(V=Y)

  -- How many different source-level preconditions an artefact has: called
  -- without source= or preconditions=TRUE, every source runs regardless.
  LET GateRows(S) = SELECT count() AS N FROM foreach(row=filter(list=S.precondition, condition="x=>x")) GROUP BY _value
  LET DistinctGates(S) = if(condition=IsList(V=S), then=len(list=GateRows(S=S).N), else=0)
  LET UniverseRows = SELECT name AS Name, parameters.name AS Params, aliases AS Aliases, DistinctGates(S=sources) AS Gates
    FROM artifact_definitions() WHERE NOT name =~ "(?-i)^Linter\\."
  LET Universe <= memoize(query={ SELECT Name, Params, Gates FROM chain(
       a={ SELECT Name, Params, Gates FROM UniverseRows },
       b={ SELECT Name, Params, Gates FROM foreach(row=UniverseRows,
             query={ SELECT _value AS Name, Params, Gates FROM foreach(row=Aliases) }) }) }, key="Name")
  LET OwnRows = SELECT Name, Env, Rel,
         if(condition=Y.parameters, then=join(array=Y.parameters.name, sep=","), else="") AS ParamsText,
         DistinctGates(S=Y.sources) AS Gates
    FROM Arts WHERE NOT IsDoc AND IsStr(V=Name)
  LET OwnEnvs <= memoize(query={ SELECT Name, enumerate(items=Env) AS Envs,
         join(array=enumerate(items=ParamsText), sep=",") AS ParamsText,
         max(item=Gates) AS Gates
    FROM OwnRows GROUP BY Name }, key="Name")
  LET GatesOf(Target) = get(item=Universe, field=Target).Gates || get(item=OwnEnvs, field=Target).Gates || 0
  LET Known(Target) = get(item=Universe, field=Target) OR get(item=OwnEnvs, field=Target)
  LET KnownParams(Target) = "," + join(array=[
         if(condition=get(item=Universe, field=Target), then=join(array=get(item=Universe, field=Target).Params, sep=","), else=""),
         if(condition=get(item=OwnEnvs, field=Target), then=get(item=OwnEnvs, field=Target).ParamsText, else="")
       ], sep=",") + ","

  LET StrRe = "(?s)\\x27{3}.*?\\x27{3}|\\x22(?:[^\\x22\\\\\\n]|\\\\.)*\\x22|\\x27(?:[^\\x27\\\\\\n]|\\\\.)*\\x27|`[^`\\n]*`"
  LET CmtRe = "(?s)//[^\\n]*|--[^\\n]*|/\\*.*?\\*/"
  LET NoStr(Q) = regex_replace(source=Q, re=StrRe, replace=" ")
  LET Mask(Q) = regex_replace(source=NoStr(Q=Q), re=CmtRe, replace=" ")
  LET Collapse(S) = regex_replace(source=S, re="\\s+", replace=" ")
  LET Unnest(S) = regex_replace(source=regex_replace(source=regex_replace(source=S, re="\\([^()]*\\)", replace="()"), re="\\{[^{}]*\\}", replace="{}"), re="\\[[^\\[\\]]*\\]", replace="[]")
  LET Flat(S) = Unnest(S=Unnest(S=Unnest(S=Unnest(S=Unnest(S=Unnest(S=S))))))
  LET Comments(Q) = SELECT Cmt FROM parse_records_with_regex(file=NoStr(Q=Q), accessor="data",
         regex="(?s)(?P<Cmt>//[^\\n]*|--[^\\n]*|/\\*.*?\\*/)")
    WHERE NOT Cmt =~ "^(//|--)\\s*linter:\\s*[a-z_]+:\\S*\\s*$"

  LET SrcIdx(Y) = SELECT _value AS I FROM range(start=0, end=len(list=Y.sources), step=1)
  LET Blocks(Y) = SELECT Field, Q FROM chain(
       a={ SELECT "precondition" AS Field, Y.precondition AS Q FROM scope() },
       b={ SELECT "export" AS Field, Y.export AS Q FROM scope() },
       c={ SELECT format(format="sources[%v].query", args=I) AS Field, Y.sources[I].query AS Q FROM SrcIdx(Y=Y) },
       d={ SELECT format(format="sources[%v].precondition", args=I) AS Field, Y.sources[I].precondition AS Q FROM SrcIdx(Y=Y) })
    WHERE IsStr(V=Q)
  LET AllVQL(Y) = join(array=Blocks(Y=Y).Q, sep="\n")
  LET CellIdx(S) = SELECT _value AS J FROM range(start=0, end=len(list=S.notebook), step=1)
  LET Cells(Y) = SELECT Q FROM foreach(row={ SELECT Y.sources[I] AS S FROM SrcIdx(Y=Y) WHERE IsDict(V=Y.sources[I]) AND IsList(V=Y.sources[I].notebook) },
       query={ SELECT S.notebook[J].template AS Q FROM CellIdx(S=S) WHERE IsDict(V=S.notebook[J]) AND S.notebook[J].type = "vql" AND IsStr(V=S.notebook[J].template) })
  LET AllVQLAndCells(Y) = join(array=Blocks(Y=Y).Q + Cells(Y=Y).Q, sep="\n")

  -- Identity and layout ------------------------------------------------------
  LET R001 = SELECT Rel AS Path, 1 AS Line, "VS001" AS Rule, "error" AS Severity,
         "YAML does not parse, or the top level is not a mapping" AS Message
    FROM Parsed WHERE NOT IsDict(V=Y)
  LET R002 = SELECT Rel AS Path, 1 AS Line, "VS002" AS Rule, "error" AS Severity,
         if(condition=NOT LayoutOK(Comps=Comps),
            then="artefacts live under Dev|Prod/Client|Server|Notebooks/",
            else=if(condition=Base =~ "(?-i)\\.yml$",
                    then="artefact files use .yaml; .yml is reserved for doc<Name>.yml companions",
                    else="unexpected file extension")) AS Message
    FROM Parsed WHERE NOT LayoutOK(Comps=Comps) OR (NOT IsDoc AND NOT Base =~ "(?-i)\\.yaml$")
  LET R003 = SELECT Rel AS Path, 1 AS Line, "VS003" AS Rule, "error" AS Severity,
         if(condition=NOT IsStr(V=Name) OR Name = "",
            then="`name` is required",
            else=format(format="name `%v` does not match the file path (expected `%v`)", args=[Name, Expected])) AS Message
    FROM Arts WHERE NOT IsStr(V=Name) OR Name = "" OR (LayoutIsOK AND (IsDoc OR Base =~ "(?-i)\\.yaml$") AND Name != Expected)
  LET Segs(Name) = split(string=Name, sep="\\.")
  LET NameMsgs(Name) = SELECT _value AS Msg FROM foreach(row=if(condition=NOT Name =~ "^[a-zA-Z0-9_.]+$",
       then=["name may only contain a-z, A-Z, 0-9, `_` and `.`"],
       else=[
         if(condition=len(list=filter(list=Segs(Name=Name), regex="(?-i)^[^A-Z]|[^A-Za-z0-9]")) > 0,
            then=format(format="name segments must be UpperCamelCase ASCII: %v",
                        args=[join(array=filter(list=Segs(Name=Name), regex="(?-i)^[^A-Z]|[^A-Za-z0-9]"), sep=", ")])),
         if(condition=NOT Segs(Name=Name)[1] =~ "(?-i)^(Windows|Linux|MacOS|Generic|General|Server|Bundle|DetectRaptor)$",
            then=format(format="second segment `%v` is not a platform: Bundle, DetectRaptor, General, Generic, Linux, MacOS, Server, Windows",
                        args=[Segs(Name=Name)[1]])),
         if(condition=len(list=Segs(Name=Name)) < 3 OR len(list=Segs(Name=Name)) > 6,
            then="name has 3 to 6 dot-separated segments")
       ])) WHERE Msg
  LET R004 = SELECT Rel AS Path, 1 AS Line, "VS004" AS Rule, "error" AS Severity, Msg AS Message
    FROM foreach(row={ SELECT * FROM Arts WHERE IsStr(V=Name) AND Name != "" },
                 query={ SELECT Rel, Msg FROM NameMsgs(Name=Name) })
  LET R026 = SELECT Rel AS Path, 1 AS Line, "VS026" AS Rule, "error" AS Severity,
         format(format="name `%v` collides with an upstream artefact (built-in, Exchange or DetectRaptor)", args=[Name]) AS Message
    FROM Arts WHERE IsStr(V=Name) AND get(item=Universe, field=Name)

  -- Fields -------------------------------------------------------------------
  LET TypeMsgs(Y, TypeU, IsDoc, Kind) = SELECT _value AS Msg FROM foreach(row=if(condition=NOT "type" IN Keys(D=Y) OR NOT Y.type,
       then=["`type` must be set explicitly"],
       else=[
         if(condition=str(str=Y.type) != TypeU, then="`type` is written in upper case"),
         if(condition=NOT TypeU =~ "^(CLIENT|CLIENT_EVENT|SERVER|SERVER_EVENT|NOTEBOOK|INTERNAL)$",
            then=format(format="unknown type `%v`", args=[Y.type]),
            else=if(condition=IsDoc,
                    then=if(condition=TypeU != "NOTEBOOK", then="doc companions are `type: NOTEBOOK`"),
                    else=if(condition=(Kind = "Client" AND NOT TypeU =~ "^CLIENT(_EVENT)?$")
                                      OR (Kind = "Server" AND NOT TypeU =~ "^SERVER(_EVENT)?$")
                                      OR (Kind = "Notebooks" AND TypeU != "NOTEBOOK"),
                            then=format(format="type `%v` does not belong under %v/", args=[Y.type, Kind]))))
       ])) WHERE Msg
  LET R005 = SELECT Rel AS Path, 1 AS Line, "VS005" AS Rule, "error" AS Severity, Msg AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Msg FROM TypeMsgs(Y=Y, TypeU=TypeU, IsDoc=IsDoc, Kind=Kind) })
  LET TopMsgs(Y, IsDoc, Env) = SELECT Rule, Severity, Msg FROM foreach(row=[
       dict(Rule="VS007", Severity="error", Msg=if(condition="reports" IN Keys(D=Y), then="`reports` is not allowed: reports are deprecated upstream")),
       dict(Rule="VS007", Severity="error", Msg=if(condition="references" IN Keys(D=Y), then="`references` is not allowed: use `reference`")),
       dict(Rule="VS006", Severity="error", Msg=if(condition=NOT (IsStr(V=Y.description) AND Y.description =~ "\\S"), then="`description` is required and must be a non-empty string")),
       dict(Rule="VS006", Severity="error", Msg=if(condition=NOT (IsStr(V=Y.author) AND Y.author =~ "\\S"), then="`author` is required and must be a non-empty string")),
       dict(Rule="VS006", Severity=Sev(Env=Env), Msg=if(condition=NOT "reference" IN Keys(D=Y) AND NOT IsDoc, then="`reference` is missing (should have at least one link)")),
       dict(Rule="VS006", Severity="error", Msg=if(condition="reference" IN Keys(D=Y) AND NOT IsList(V=Y.reference), then="`reference` is a list")),
       dict(Rule="VS006", Severity="error", Msg=if(condition=NOT IsList(V=Y.sources) OR len(list=Y.sources) = 0, then="`sources` must be a non-empty list"))
     ]) WHERE Msg
  LET R006 = SELECT Rel AS Path, 1 AS Line, Rule, Severity, Msg AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Rule, Severity, Msg FROM TopMsgs(Y=Y, IsDoc=IsDoc, Env=Env) })
  LET Esc(L) = regex_replace(source=regex_replace(source=L, re="\\\\", replace="\\\\\\\\"), re="\\x22", replace="\\\\\\x22")
  LET R008 = SELECT Rel AS Path, Line, "VS008" AS Rule, "error" AS Severity,
         "YAML comments are not allowed in artefacts" AS Message
    FROM foreach(row={ SELECT Rel, serialize(item=Y) AS Ser, split(string=Text, sep="\\n") AS Ls FROM Arts },
                 query={ SELECT Rel, I + 1 AS Line
                         FROM foreach(row={ SELECT _value AS I FROM range(start=0, end=len(list=Ls), step=1) })
                         WHERE Ls[I] =~ "^\\s*#" AND NOT Esc(L=Trim(S=Ls[I])) IN Ser })
  LET R009 = SELECT Rel AS Path, 1 AS Line, "VS009" AS Rule,
         if(condition=len(list=Text) > 100000, then="error", else=Sev(Env=Env)) AS Severity,
         format(format="file is %v bytes; the verifier reads at most 100000", args=[len(list=Text)]) AS Message
    FROM Arts WHERE len(list=Text) > 80000
  LET DescOf(Y) = if(condition=IsStr(V=Y.description), then=Y.description, else="")
  LET DescLines(Y) = len(list=split(string=regex_replace(source=DescOf(Y=Y), re="^\\n+|\\n+$", replace=""), sep="\\n"))
  LET R010 = SELECT Rel AS Path, 1 AS Line, "VS010" AS Rule, "error" AS Severity, Msg AS Message
    FROM foreach(row=Arts, query={
       SELECT Rel, _value AS Msg FROM foreach(row=[
          if(condition=regex_replace(source=DescOf(Y=Y), re="(?s)^\\s+", replace="") =~ "(?i)^this (artefact|artifact)",
             then="description starts with a lead sentence, not `This artefact...`"),
          if(condition=NOT IsDoc AND (DescLines(Y=Y) > 12 OR len(list=DescOf(Y=Y)) > 1000),
             then=format(format="description is %v lines / %v chars; keep it to 12 lines / 1000 chars and move the rest into doc<Name>.yml",
                         args=[DescLines(Y=Y), len(list=DescOf(Y=Y))]))
       ]) WHERE Msg })

  -- Doc companions -----------------------------------------------------------
  LET DocPath(Rel) = regex_replace(source=Rel, re="(?-i)([^/]+)\\.yaml$", replace="doc$1.yml")
  LET ArtPath(Rel) = regex_replace(source=Rel, re="(?-i)doc([^/]+)\\.yml$", replace="$1.yaml")
  LET R011 = SELECT Rel AS Path, 1 AS Line, "VS011" AS Rule, "error" AS Severity,
         format(format="`reference` must link the doc companion: [Documentation](#/artifacts/%v.Doc)", args=[Name]) AS Message
    FROM Arts WHERE NOT IsDoc AND Base =~ "(?-i)\\.yaml$" AND IsStr(V=Name) AND get(item=FileSet, field=DocPath(Rel=Rel))
         AND NOT ("#/artifacts/" + Name + ".Doc" IN serialize(item=Y.reference))
  LET Cell(Y) = Y.sources[0].notebook[0]
  LET DocMsgs(Y, Rel) = SELECT _value AS Msg FROM foreach(row=[
       if(condition=NOT get(item=FileSet, field=ArtPath(Rel=Rel)), then=format(format="doc companion has no artefact `%v`", args=[ArtPath(Rel=Rel)])),
       if(condition=NOT (len(list=Y.sources) = 1 AND IsDict(V=Y.sources[0]) AND IsList(V=Y.sources[0].notebook) AND len(list=Y.sources[0].notebook) > 0),
          then="doc companion has exactly one source holding `notebook` cells",
          else=if(condition=NOT (IsDict(V=Cell(Y=Y)) AND Cell(Y=Y).type =~ "^(markdown|md)$"),
                  then="the first notebook cell is a markdown cell",
                  else=if(condition=NOT (Cell(Y=Y).template AND str(str=Cell(Y=Y).template) =~ "\\S"),
                          then="the markdown cell needs a `template`"))),
       if(condition=Y.parameters, then="doc companions take no parameters")
     ]) WHERE Msg
  LET R012 = SELECT Rel AS Path, 1 AS Line, "VS012" AS Rule, "error" AS Severity, Msg AS Message
    FROM foreach(row={ SELECT * FROM Arts WHERE IsDoc }, query={ SELECT Rel, Msg FROM DocMsgs(Y=Y, Rel=Rel) })

  -- Sources ------------------------------------------------------------------
  LET SrcMsgs(Y, TypeU, Env) = SELECT I, Rule, Severity, Msg
    FROM foreach(row={ SELECT I, Y.sources[I] AS S FROM SrcIdx(Y=Y) }, query={
       SELECT I, Rule, Severity, Msg FROM foreach(row=[
         dict(Rule="VS021", Severity="error", Msg=if(condition=NOT IsDict(V=S), then="each source is a mapping")),
         dict(Rule="VS007", Severity="error", Msg=if(condition=IsDict(V=S) AND "queries" IN Keys(D=S), then="`queries` is not allowed in a source: use `query`")),
         dict(Rule="VS021", Severity="error", Msg=if(condition=IsDict(V=S) AND TypeU != "NOTEBOOK" AND NOT (IsStr(V=S.query) AND S.query =~ "\\S"), then="source has no `query`")),
         dict(Rule="VS020", Severity="error", Msg=if(condition=IsDict(V=S) AND TypeU != "NOTEBOOK" AND len(list=Y.sources) > 1 AND NOT (IsStr(V=S.name) AND S.name != ""), then="every source of a multi-source artefact is named")),
         dict(Rule="VS020", Severity="error", Msg=if(condition=IsDict(V=S) AND TypeU != "NOTEBOOK" AND len(list=Y.sources) > 1 AND IsStr(V=S.name) AND S.name != "" AND NOT S.name =~ "^[A-Za-z0-9_.-]+$", then=format(format="source name `%v` has invalid characters", args=[S.name]))),
         dict(Rule="VS022", Severity=Sev(Env=Env), Msg=if(condition=IsDict(V=S) AND TypeU =~ "^CLIENT(_EVENT)?$" AND NOT IsStr(V=Y.precondition) AND NOT IsStr(V=S.precondition), then="client source has no precondition (OS gate) and the artefact has none"))
       ]) WHERE Msg })
  LET R020 = SELECT Rel AS Path, 1 AS Line, Rule, Severity, format(format="source %v: %v", args=[I + 1, Msg]) AS Message
    FROM foreach(row={ SELECT * FROM Arts WHERE IsList(V=Y.sources) AND NOT IsDoc }, query={ SELECT Rel, I, Rule, Severity, Msg FROM SrcMsgs(Y=Y, TypeU=TypeU, Env=Env) })
  LET R020dup = SELECT Rel AS Path, 1 AS Line, "VS020" AS Rule, "error" AS Severity,
         format(format="duplicate source name `%v`", args=[SName]) AS Message
    FROM foreach(row={ SELECT * FROM Arts WHERE IsList(V=Y.sources) AND NOT IsDoc }, query={
       SELECT Rel, SName, count() AS N
       FROM foreach(row=SrcIdx(Y=Y), query={ SELECT Y.sources[I].name AS SName FROM scope() WHERE IsStr(V=Y.sources[I].name) AND Y.sources[I].name != "" })
       GROUP BY SName })
    WHERE N > 1

  -- VQL text: comments, calls, LET names, logging ------------------------------
  LET R023 = SELECT Rel AS Path, 1 AS Line, "VS023" AS Rule, "error" AS Severity,
         format(format="comment in `%v`; VQL carries no comments (only `// linter: <rule>:<subject>` directives): %v", args=[Field, Trim(S=Cmt)]) AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Field, Cmt FROM foreach(row=Blocks(Y=Y), query={ SELECT Field, Cmt FROM Comments(Q=Q) }) })
  LET CallRe = "\\bArtifact\\x2e(?P<Target>[A-Za-z0-9_.]+)\\s*\\((?P<Body>[^()]*(?:\\([^()]*\\)[^()]*){0,4})\\)"
  LET Calls(Y) = SELECT Field, Target, Body FROM foreach(row=Blocks(Y=Y), query={
       SELECT Field, Target, Body FROM parse_records_with_regex(file=Collapse(S=Mask(Q=Q)), accessor="data", regex=CallRe) })
  LET Kwargs(Body) = SELECT regex_replace(source=Trim(S=_value), re="\\s*=.*$", replace="") AS Kw
    FROM foreach(row=split(string=Flat(S=Body), sep=",")) WHERE Trim(S=_value) =~ "^[A-Za-z_][A-Za-z0-9_]*\\s*="
  LET CallMsgs(Env, Field, Target, Body) = SELECT Rule, Severity, Message FROM chain(
       a={ SELECT "VS024" AS Rule, "error" AS Severity,
                  format(format="`%v%v` in `%v` is not defined in this tree, the built-ins, the Exchange or DetectRaptor", args=[AP, Target, Field]) AS Message
           FROM scope() WHERE NOT Known(Target=Target) },
       b={ SELECT "VS040" AS Rule, "error" AS Severity,
                  format(format="Prod artefact depends on `%v` which exists only in Dev", args=[Target]) AS Message
           FROM scope() WHERE Env = "Prod" AND NOT get(item=Universe, field=Target) AND get(item=OwnEnvs, field=Target)
                 AND NOT "Prod" IN get(item=OwnEnvs, field=Target).Envs },
       c={ SELECT "VS025" AS Rule, "error" AS Severity,
                  format(format="`%v%v` has no parameter `%v`", args=[AP, Target, Kw]) AS Message
           FROM Kwargs(Body=Body)
           WHERE Known(Target=Target) AND NOT Body =~ "\\*\\*" AND NOT Kw =~ "^(source|preconditions)$"
                 AND NOT ("," + Kw + ",") IN KnownParams(Target=Target) },
       d={ SELECT "VS083" AS Rule, Sev(Env=Env) AS Severity,
                  format(format="`%v%v()` in `%v` has %v differently gated sources, which all run when called this way; pass `preconditions=TRUE`, or `source=` for one of them", args=[AP, Target, Field, GatesOf(Target=Target)]) AS Message
           FROM scope()
           WHERE Known(Target=Target) AND GatesOf(Target=Target) > 1
                 AND NOT Body =~ "\\b(preconditions|source)\\s*=" })
  LET R024 = SELECT Rel AS Path, 1 AS Line, Rule, Severity, Message
    FROM foreach(row=Arts, query={ SELECT Rel, Rule, Severity, Message FROM foreach(row=Calls(Y=Y), query={
         SELECT Rule, Severity, Message FROM CallMsgs(Env=Env, Field=Field, Target=Target, Body=Body) }) })
  LET R042 = SELECT Rel AS Path, 1 AS Line, "VS042" AS Rule, "error" AS Severity,
         format(format="`%v` is defined more than once in %v: %v", args=[Name, Env, join(array=Paths_, sep=", ")]) AS Message
    FROM foreach(row={ SELECT Name, Env, count() AS N, enumerate(items=Rel) AS Paths_ FROM OwnRows GROUP BY Name + "/" + Env },
                 query={ SELECT _value AS Rel, Name, Env, Paths_ FROM foreach(row=Paths_) WHERE N > 1 })
  LET R062 = SELECT Rel AS Path, 1 AS Line, "VS062" AS Rule, Sev(Env=Env) AS Severity,
         format(format="`LET %v` in `%v`: variables are UpperCamelCase like parameters (`_` prefix for scratch values)", args=[LetName, Field]) AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Env, Field, LetName FROM foreach(row=Blocks(Y=Y), query={
         SELECT Field, parse_string_with_regex(string=_value, regex="^\\s*LET\\s+(?P<LetName>[A-Za-z_][A-Za-z0-9_]*)").LetName AS LetName
         FROM foreach(row=split(string=Mask(Q=Q), sep="\\n"))
         WHERE LetName AND NOT LetName =~ "(?-i)^_?[A-Z][A-Za-z0-9]*$" }) })
  LET LogRe = "\\blog\\((?P<Body>[^()]*(?:\\([^()]*\\)[^()]*){0,4})\\)"
  LET LogLevel(Body) = parse_string_with_regex(string=Body, regex="\\blevel\\s*=\\s*[\\x22\\x27](?P<Level>[A-Za-z]+)[\\x22\\x27]").Level
  LET LogMessage(Body) = if(condition=Body =~ "\\bmessage\\s*=\\s*\\x22",
         then=parse_string_with_regex(string=Body, regex="\\bmessage\\s*=\\s*\\x22(?P<M>[^\\x22]*)\\x22").M,
         else=parse_string_with_regex(string=Body, regex="\\bmessage\\s*=\\s*\\x27(?P<M>[^\\x27]*)\\x27").M)
  LET LogMsgs(Field, Body) = SELECT _value AS Msg FROM foreach(row=[
       if(condition=NOT Body =~ "\\blevel\\s*=",
          then=format(format="`log()` in `%v` has no `level=`; say ERROR, WARN, INFO or DEBUG (an ERROR marks the collection failed)", args=[Field])),
       if(condition=LogLevel(Body=Body) AND NOT upcase(string=LogLevel(Body=Body)) =~ "^(DEFAULT|ERROR|WARN|WARNING|INFO|DEBUG|ALERT)$",
          then=format(format="`log()` level `%v` is not one Velociraptor knows (ERROR, WARN, INFO, DEBUG)", args=[LogLevel(Body=Body)]))
     ]) WHERE Msg
  LET R060 = SELECT Rel AS Path, 1 AS Line, "VS060" AS Rule, Sev(Env=Env) AS Severity, Msg AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Env, Msg FROM foreach(row=Blocks(Y=Y), query={
         SELECT Msg FROM foreach(row={ SELECT Field, Body FROM parse_records_with_regex(file=Collapse(S=Q), accessor="data", regex=LogRe) },
                                 query={ SELECT Msg FROM LogMsgs(Field=Field, Body=Body) }) }) })
  LET R061 = SELECT Rel AS Path, 1 AS Line, "VS061" AS Rule, Sev(Env=Env) AS Severity,
         format(format="`log()` in `%v` at level %v carries error text (`Error:` ...); Velociraptor marks the collection failed on it, so either log at ERROR or reword the message", args=[Field, upcase(string=LogLevel(Body=Body))]) AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Env, Field, Body FROM foreach(row=Blocks(Y=Y), query={
         SELECT Field, Body FROM parse_records_with_regex(file=Collapse(S=Q), accessor="data", regex=LogRe)
         WHERE LogLevel(Body=Body) AND upcase(string=LogLevel(Body=Body)) != "ERROR" AND LogMessage(Body=Body)
               AND LogMessage(Body=Body) =~ "(?i)(Error:|Symbol.+?not found|Expecting a path arg type, not|Field.+?is required|Unexpected arg)" }) })

  -- Parameters ---------------------------------------------------------------
  LET ParamRows(Y) = SELECT I, Y.parameters[I] AS P FROM foreach(row={ SELECT _value AS I FROM range(start=0, end=len(list=Y.parameters), step=1) })
  LET AllowedTypes(N) = if(condition=N =~ "(?-i)Regex$", then="regex",
       else=if(condition=N =~ "(?-i)Globs$", then="csv|json_array",
       else=if(condition=N =~ "(?-i)Glob$", then="|string",
       else=if(condition=N =~ "(?-i)(After|Before)$", then="timestamp",
       else=if(condition=N =~ "(?-i)(Table|List)$", then="csv|json_array",
       else=if(condition=N =~ "(?-i)Selection$", then="multichoice|choices|artifactset",
       else=if(condition=N =~ "(?-i)(Limit|Count|Rows|Workers|Timeout|Depth)$", then="int|int64|integer",
       else=if(condition=N =~ "(?-i)Yara$", then="yara"))))))))
  LET Stage(N, T) = if(condition=T =~ "^(hidden|server_metadata|redacted)$", then=4,
       else=if(condition=T = "artifactset" OR N =~ "(?-i)Selection$", then=0,
       else=if(condition=N =~ "(?-i)(Glob|Globs|Path|Paths|Dir|Dirs|File|Files|Table)$", then=1,
       else=if(condition=N =~ "(?-i)(Regex|Yara|After|Before|Time|Timestamp|Date)$" OR N =~ "(?-i)^(Include|Exclude|Only)[A-Z]", then=2,
       else=if(condition=T =~ "^(upload|upload_file)$" OR N =~ "(?-i)^(Upload|Max)[A-Z]" OR N =~ "(?-i)(Limit|Count|Rows|Workers|Timeout|Depth)$", then=3,
       else=-1)))))
  LET StageName(S) = split(string="Selection,Scope,Filter,Output,Server", sep=",")[S]
  LET PType(P) = if(condition=P.type, then=str(str=P.type), else="")
  LET PHint(P) = if(condition=IsStr(V=P.description), then=P.description, else="")
  LET ParamMsgs(P, Env, MaskedAll, RawAll) = SELECT Rule, Severity, Msg FROM foreach(row=[
       dict(Rule="VS030", Severity="error", Msg=if(condition=NOT P.name =~ "(?-i)^[A-Z]([A-Za-z0-9]|_[0-9A-Z])*$", then=format(format="parameter `%v` must be UpperCamelCase", args=[P.name]))),
       dict(Rule="VS031", Severity="error", Msg=if(condition=NOT PHint(P=P) =~ "\\S", then=format(format="parameter `%v` needs a `description` hint", args=[P.name]))),
       dict(Rule="VS037", Severity=Sev(Env=Env), Msg=if(condition=len(list=PHint(P=P)) > 500, then=format(format="hint for `%v` is %v characters; keep it under 500 and move the explanation to the doc companion", args=[P.name, len(list=PHint(P=P))]))),
       dict(Rule="VS032", Severity="error", Msg=if(condition=NOT "default" IN Keys(D=P) AND NOT PType(P=P) =~ "^(hidden|upload|upload_file|server_metadata|timestamp)$", then=format(format="parameter `%v` needs a `default`", args=[P.name]))),
       dict(Rule="VS033", Severity="error", Msg=if(condition=AllowedTypes(N=P.name) AND NOT ("|" + PType(P=P) + "|") IN ("|" + AllowedTypes(N=P.name) + "|"), then=format(format="parameter `%v` ends in a typed suffix, so its type is %v, not `%v`", args=[P.name, AllowedTypes(N=P.name), PType(P=P)]))),
       dict(Rule="VS033", Severity="error", Msg=if(condition=PType(P=P) = "regex" AND NOT P.name =~ "(?-i)Regex$", then=format(format="parameter `%v` is type `regex`; its name ends with Regex", args=[P.name]))),
       dict(Rule="VS033", Severity="error", Msg=if(condition=PType(P=P) = "timestamp" AND NOT P.name =~ "(?-i)(After|Before|Time|Timestamp|Date)$", then=format(format="parameter `%v` is type `timestamp`; its name ends with After/Before/Time/Timestamp/Date", args=[P.name]))),
       dict(Rule="VS033", Severity="error", Msg=if(condition=PType(P=P) != lowcase(string=PType(P=P)), then=format(format="parameter type `%v` is lower case", args=[PType(P=P)]))),
       dict(Rule="VS034", Severity="error", Msg=if(condition=P.name =~ "(?-i)(Glob|Globs|Regex)$" AND PHint(P=P) =~ "\\S" AND NOT lowcase(string=PHint(P=P)) =~ if(condition=P.name =~ "(?-i)Glob", then="glob", else="regex"), then=format(format="hint for `%v` must say it is a %v and that the full pattern (wildcards/anchors included) is the input", args=[P.name, if(condition=P.name =~ "(?-i)Glob", then="glob", else="regex")]))),
       dict(Rule="VS034", Severity=Sev(Env=Env), Msg=if(condition=P.name =~ "(?-i)(Glob|Globs|Regex)$" AND PHint(P=P) =~ "\\S" AND NOT PHint(P=P) =~ "(?i)wildcard|anchor|full|complete|entire|verbatim|as[- ]is", then=format(format="hint for `%v` should state that wildcards/anchors live in the value itself (it is used verbatim)", args=[P.name]))),
       dict(Rule="VS039", Severity=Sev(Env=Env), Msg=if(condition=P.name =~ "(?-i)(Glob|Globs|Regex)$" AND PHint(P=P) =~ "\\S" AND NOT (PHint(P=P) =~ "(?i)\\bquot(e|es|ed|ing)\\b" AND PHint(P=P) =~ "(?i)\\be\\.g\\.|\\bfor example\\b|\\bexample\\b|\\bsuch as\\b"), then=format(format="hint for `%v` lacks %v", args=[P.name, join(array=filter(list=[if(condition=NOT PHint(P=P) =~ "(?i)\\bquot(e|es|ed|ing)\\b", then="whether quotes are needed", else=""), if(condition=NOT PHint(P=P) =~ "(?i)\\be\\.g\\.|\\bfor example\\b|\\bexample\\b|\\bsuch as\\b", then="an example (`e.g. ...`)", else="")], regex="."), sep=" and ")]))),
       dict(Rule="VS038", Severity=Sev(Env=Env), Msg=if(condition=NOT MaskedAll =~ "\\b" + P.name + "\\b", then=format(format="parameter `%v` is never used in VQL", args=[P.name])))
     ]) WHERE Msg
  LET R030 = SELECT Rel AS Path, 1 AS Line, Rule, Severity, Msg AS Message
    FROM foreach(row={ SELECT Rel, Env, Y, Mask(Q=AllVQLAndCells(Y=Y)) AS MaskedAll, AllVQLAndCells(Y=Y) AS RawAll FROM Arts WHERE NOT IsDoc AND IsList(V=Y.parameters) },
                 query={ SELECT Rel, Rule, Severity, Msg FROM foreach(row={ SELECT P FROM ParamRows(Y=Y) WHERE IsDict(V=P) AND IsStr(V=P.name) },
                                                                       query={ SELECT Rule, Severity, Msg FROM ParamMsgs(P=P, Env=Env, MaskedAll=MaskedAll, RawAll=RawAll) }) })
  LET R030shape = SELECT Rel AS Path, 1 AS Line, "VS030" AS Rule, "error" AS Severity, Msg AS Message
    FROM foreach(row={ SELECT * FROM Arts WHERE NOT IsDoc AND "parameters" IN Keys(D=Y) }, query={
       SELECT Rel, _value AS Msg FROM foreach(row=[
         if(condition=NOT IsList(V=Y.parameters), then="`parameters` is a list"),
         if(condition=IsList(V=Y.parameters) AND len(list=filter(list=ParamRows(Y=Y).P, regex="^\\{")) < 0, then="unreachable")
       ]) WHERE Msg })
  LET R030dup = SELECT Rel AS Path, 1 AS Line, "VS030" AS Rule, "error" AS Severity,
         format(format="duplicate parameter `%v`", args=[PName]) AS Message
    FROM foreach(row={ SELECT * FROM Arts WHERE NOT IsDoc AND IsList(V=Y.parameters) }, query={
       SELECT Rel, PName, count() AS N FROM foreach(row=ParamRows(Y=Y), query={ SELECT P.name AS PName FROM scope() WHERE IsDict(V=P) AND IsStr(V=P.name) }) GROUP BY PName })
    WHERE N > 1
  LET R030map = SELECT Rel AS Path, 1 AS Line, "VS030" AS Rule, "error" AS Severity,
         format(format="parameter %v: each parameter is a mapping with a `name`", args=[I + 1]) AS Message
    FROM foreach(row={ SELECT * FROM Arts WHERE NOT IsDoc AND IsList(V=Y.parameters) }, query={
       SELECT Rel, I FROM ParamRows(Y=Y) WHERE NOT (IsDict(V=P) AND IsStr(V=P.name)) })
  LET ConcatRes(N) = array(a="(?P<Lit>\\x22[^\\x22]*\\x22|\\x27[^\\x27]*\\x27)\\s*\\+\\s*" + N + "\\b", b="\\b" + N + "\\s*\\+\\s*(?P<Lit>\\x22[^\\x22]*\\x22|\\x27[^\\x27]*\\x27)")
  LET R035 = SELECT Rel AS Path, 1 AS Line, "VS035" AS Rule, "error" AS Severity,
         format(format="`%v` is concatenated with a literal in VQL; the user input holds the complete pattern and is used verbatim", args=[PName]) AS Message
    FROM foreach(row={ SELECT Rel, Y, AllVQL(Y=Y) AS RawAll FROM Arts WHERE NOT IsDoc AND IsList(V=Y.parameters) }, query={
       SELECT Rel, PName, count() AS Hits
       FROM foreach(row={ SELECT P.name AS PName FROM ParamRows(Y=Y) WHERE IsDict(V=P) AND IsStr(V=P.name) AND P.name =~ "(?-i)(Glob|Globs|Regex)$" },
                    query={ SELECT PName, Lit FROM parse_records_with_regex(file=RawAll, accessor="data", regex=ConcatRes(N=PName)) WHERE NOT Lit =~ "^.\\|.$" })
       GROUP BY PName })
  LET R036 = SELECT Rel AS Path, 1 AS Line, "VS036" AS Rule, "error" AS Severity, Message
    FROM foreach(row={ SELECT * FROM Arts WHERE NOT IsDoc AND IsList(V=Y.parameters) }, query={
       SELECT Rel, Message FROM foreach(row={ SELECT _value AS I FROM range(start=0, end=len(list=Y.parameters), step=1) }, query={
          SELECT format(format="parameter `%v` (%v) comes before `%v` (%v); order is Selection > Scope > Filter > Output > Server",
                        args=[Y.parameters[J].name, StageName(S=Stage(N=Y.parameters[J].name, T=PType(P=Y.parameters[J]))),
                              Y.parameters[I].name, StageName(S=Stage(N=Y.parameters[I].name, T=PType(P=Y.parameters[I])))]) AS Message
          FROM foreach(row={ SELECT _value AS J FROM range(start=0, end=I, step=1) })
          WHERE IsDict(V=Y.parameters[I]) AND IsDict(V=Y.parameters[J])
                AND Stage(N=Y.parameters[I].name, T=PType(P=Y.parameters[I])) >= 0
                AND Stage(N=Y.parameters[J].name, T=PType(P=Y.parameters[J])) > Stage(N=Y.parameters[I].name, T=PType(P=Y.parameters[I]))
          LIMIT 1 }) })

  -- Outputs ------------------------------------------------------------------
  LET FinalStmt(M) = split(string=M, sep="(?m)^SELECT\\b")[-1]
  LET ProjText(F) = if(condition=F =~ "(?m)^FROM\\b", then=split(string=F, sep="(?m)^FROM\\b")[0], else=split(string=F, sep="\\bFROM\\b")[0])
  LET ProjItems(Q) = SELECT Trim(S=_value) AS Item FROM foreach(row=split(string=Flat(S=ProjText(F=FinalStmt(M=Mask(Q=Q)))), sep=",")) WHERE Trim(S=_value) != ""
  LET ItemKind(Item) = if(condition=Item = "*", then="star",
       else=if(condition=Item =~ "^[A-Za-z_][A-Za-z0-9_]*$", then="bare",
       else=if(condition=Item =~ "(?i)\\bAS\\s+[A-Za-z_][A-Za-z0-9_]*\\s*$", then="alias", else="expr")))
  LET ItemName(Item) = if(condition=Item =~ "^[A-Za-z_][A-Za-z0-9_]*$", then=Item,
       else=parse_string_with_regex(string=Item, regex="(?i)\\bAS\\s+(?P<Alias>[A-Za-z_][A-Za-z0-9_]*)\\s*$").Alias)
  LET ProjNames(Q) = SELECT ItemName(Item=Item) AS N FROM ProjItems(Q=Q) WHERE ItemKind(Item=Item) =~ "^(bare|alias)$"
  LET HasStar(Q) = len(list=filter(list=ProjItems(Q=Q).Item, regex="^\\*$")) > 0
  LET SrcOut(Y) = SELECT I, Y.sources[I].query AS Q, ProjNames(Q=Y.sources[I].query).N AS Names,
         HasStar(Q=Y.sources[I].query) AS Star,
         Mask(Q=Y.sources[I].query) =~ "\\bArtifact\\x2e[A-Za-z0-9_.]+\\s*\\(" AS CallsArtifact,
         FinalStmt(M=Mask(Q=Y.sources[I].query)) =~ "\\bFROM\\s+Artifact\\x2e" AS FromArtifact
    FROM SrcIdx(Y=Y) WHERE IsDict(V=Y.sources[I]) AND IsStr(V=Y.sources[I].query)
  LET OutArts = SELECT *, split(string=Name, sep="\\.")[1] = "Bundle" AS IsBundle, len(list=Y.sources) > 1 AS Multi
    FROM Arts WHERE NOT IsDoc AND TypeU != "NOTEBOOK" AND IsList(V=Y.sources) AND IsStr(V=Name)
  LET R050 = SELECT Rel AS Path, 1 AS Line, "VS050" AS Rule, Sev(Env=Env) AS Severity,
         format(format="output column `%v` in source %v: %v it as UpperCamelCase (an all-caps acronym or a leading `_` for metadata is fine)",
                args=[N, I + 1, if(condition=Kind_ = "alias", then="rename", else="alias")]) AS Message
    FROM foreach(row=OutArts, query={ SELECT Rel, Env, I, N, Kind_ FROM foreach(row=SrcOut(Y=Y), query={
         SELECT I, ItemName(Item=Item) AS N, ItemKind(Item=Item) AS Kind_ FROM ProjItems(Q=Q)
         WHERE ItemKind(Item=Item) =~ "^(bare|alias)$" AND NOT ItemName(Item=Item) =~ "(?-i)^_?[A-Z][A-Za-z0-9]*$" }) })
  LET R051 = SELECT Rel AS Path, 1 AS Line, "VS051" AS Rule, Sev(Env=Env) AS Severity,
         format(format="source %v of %v artefact does not project `_Source` (`\\x22<name>\\x22 AS _Source`)",
                args=[I + 1, if(condition=IsBundle, then="a bundle", else=if(condition=Multi, then="a multi-source", else="a wrapper"))]) AS Message
    FROM foreach(row=OutArts, query={ SELECT Rel, Env, IsBundle, Multi, I FROM SrcOut(Y=Y)
         WHERE (IsBundle OR Multi OR CallsArtifact) AND NOT "_Source" IN Names AND NOT (Star AND FromArtifact) })
  LET Meta(Names) = filter(list=Names, regex="^_")
  LET TailFrom(L, K) = L[K:]
  LET Payload(Names) = filter(list=Names, regex="(?-i)Upload$|^Upload|^Content$|^Parsed$|^Raw")
  LET R053 = SELECT Rel AS Path, 1 AS Line, "VS053" AS Rule, Sev(Env=Env) AS Severity, format(format="source %v: %v", args=[I + 1, Msg]) AS Message
    FROM foreach(row=OutArts, query={ SELECT Rel, Env, I, Msg FROM foreach(row={ SELECT I, Names FROM SrcOut(Y=Y) WHERE NOT Star AND len(list=Names) > 0 }, query={
         SELECT I, _value AS Msg FROM foreach(row=[
           if(condition=len(list=Meta(Names=Names)) > 0 AND len(list=filter(list=Names[:len(list=Meta(Names=Names))], regex="^_")) != len(list=Meta(Names=Names)),
              then="metadata columns (`_*`) come first in the projection"),
           if(condition=len(list=Payload(Names=Names)) > 0 AND len(list=filter(list=TailFrom(L=Names, K=len(list=Names) - len(list=Payload(Names=Names))), regex="(?-i)Upload$|^Upload|^Content$|^Parsed$|^Raw")) != len(list=Payload(Names=Names)),
              then="payload columns (`Upload`, `Content`, `Parsed`, `Raw*`) come last in the projection")
         ]) WHERE Msg }) })
  LET Missing(A, B) = SELECT _value AS N FROM foreach(row=A) WHERE NOT _value IN B
  LET R052 = SELECT Rel AS Path, 1 AS Line, "VS052" AS Rule, Sev(Env=Env) AS Severity,
         format(format="bundle source %v projects different columns from source %v (%v); every source of a bundle projects the same columns in the same order",
                args=[I + 1, First + 1, join(array=filter(list=[
                   if(condition=len(list=Missing(A=FirstNames, B=Names).N) > 0, then="missing " + join(array=Missing(A=FirstNames, B=Names).N, sep=", "), else=""),
                   if(condition=len(list=Missing(A=Names, B=FirstNames).N) > 0, then="extra " + join(array=Missing(A=Names, B=FirstNames).N, sep=", "), else=""),
                   if(condition=len(list=Missing(A=FirstNames, B=Names).N) = 0 AND len(list=Missing(A=Names, B=FirstNames).N) = 0, then="same columns in a different order", else="")
                 ], regex="."), sep="; ")]) AS Message
    FROM foreach(row={ SELECT * FROM OutArts WHERE IsBundle }, query={
       SELECT Rel, Env, I, Names, First, FirstNames
       FROM foreach(row={ SELECT I AS First, Names AS FirstNames FROM SrcOut(Y=Y) WHERE NOT Star AND len(list=Names) > 0 LIMIT 1 },
                    query={ SELECT I, Names, First, FirstNames FROM SrcOut(Y=Y) WHERE NOT Star AND len(list=Names) > 0 AND I > First AND join(array=Names, sep=",") != join(array=FirstNames, sep=",") }) })

  -- Improper methods: VQL that parses and verifies but cannot run ----------
  LET RefText <= if(condition=Reference, then=read_file(filename=Reference), else="")
  LET HaveRef <= RefText =~ "."
  LET RefRows = SELECT Name, Type FROM parse_records_with_regex(file=RefText, accessor="data",
         regex="(?s)(?-i)\\n- name: (?P<Name>[^\\n]+)\\n.*?\\n  type: (?P<Type>[A-Za-z]+)")
  LET Plugins <= memoize(query={ SELECT Name, TRUE AS Yes FROM RefRows WHERE Type = "Plugin" }, key="Name")
  LET Functions <= memoize(query={ SELECT Name, TRUE AS Yes FROM RefRows WHERE Type = "Function" }, key="Name")
  LET DefinedSet(Y) = memoize(query={ SELECT N, TRUE AS Yes FROM parse_records_with_regex(file=Mask(Q=AllVQL(Y=Y)), accessor="data",
         regex="(?-i)\\bLET\\s+(?P<N>[A-Za-z_][A-Za-z0-9_]*)") }, key="N")
  LET SourceSet(Y) = memoize(query={ SELECT str(str=Y.sources[I].name) AS N, TRUE AS Yes FROM SrcIdx(Y=Y) WHERE IsDict(V=Y.sources[I]) AND Y.sources[I].name }, key="N")
  LET R080 = SELECT Rel AS Path, 1 AS Line, "VS080" AS Rule, "error" AS Severity,
         format(format="`%v()` in `%v` is a plugin, not a function: it yields rows to `SELECT ... FROM %v()` and cannot be assigned or used as a value", args=[N, Field, N]) AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Field, N FROM foreach(row=Blocks(Y=Y), query={
         SELECT Field, N FROM parse_records_with_regex(file=Mask(Q=Q), accessor="data",
              regex="(?-i)\\bLET\\s+[A-Za-z_][A-Za-z0-9_]*\\s*<?=\\s*(?P<N>[a-z_][a-z0-9_]*)\\s*\\(")
         WHERE HaveRef AND get(item=Plugins, field=N) AND NOT get(item=Functions, field=N) }) })
  LET R081 = SELECT Rel AS Path, 1 AS Line, "VS081" AS Rule, "error" AS Severity,
         format(format="`FROM %v()` in `%v`: no such plugin in the pinned Velociraptor and no `LET %v` in this artefact", args=[N, Field, N]) AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Field, N FROM foreach(row=Blocks(Y=Y), query={
         SELECT Field, N FROM parse_records_with_regex(file=Mask(Q=Q), accessor="data",
              regex="(?-i)\\bFROM\\s+(?P<N>[A-Za-z_][A-Za-z0-9_]*)\\s*\\(")
         WHERE HaveRef AND NOT "imports" IN Keys(D=Y) AND NOT get(item=Plugins, field=N) AND NOT get(item=DefinedSet(Y=Y), field=N) }) })
  LET R082 = SELECT Rel AS Path, 1 AS Line, "VS082" AS Rule, "error" AS Severity,
         format(format="`FROM %v` in `%v` reads source `%v` as a variable; sources are not in scope at collection time (union them in a notebook with `source(source=...)`, or call `%v%v(source=...)`)", args=[N, Field, N, AP, Name]) AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Name, Field, N FROM foreach(row=Blocks(Y=Y), query={
         SELECT Field, N FROM parse_records_with_regex(file=Mask(Q=Q), accessor="data",
              regex="(?-i)\\bFROM\\s+(?P<N>[A-Za-z_][A-Za-z0-9_]*)(?P<Next>\\s*[(.]?)")
         WHERE NOT Next =~ "[(.]" AND get(item=SourceSet(Y=Y), field=N) AND NOT get(item=DefinedSet(Y=Y), field=N) }) })

  LET YaraEscapeRe = "re\\s*=\\s*[\"']/[\"']"
  LET R084 = SELECT Rel AS Path, 1 AS Line, "VS084" AS Rule, "error" AS Severity,
         format(format="`%v` in `%v` puts a value between the `/` delimiters of a YARA regex; escape `/` in the value first (`regex_replace(source=..., re=\"/\", replace=\"\\\\/\")`), or a value holding `/` ends the pattern early and the rule fails to compile", args=[Hit, Field]) AS Message
    FROM foreach(row=Arts, query={ SELECT Rel, Field, Hit FROM foreach(row=Blocks(Y=Y), query={
         SELECT Field, Hit FROM parse_records_with_regex(file=Q, accessor="data",
              regex="(?P<Hit>/%[vs]/|\\$[A-Za-z0-9_]+\\s*=\\s*/[\"']\\s*\\+)")
         WHERE NOT AllVQL(Y=Y) =~ YaraEscapeRe }) })

sources:
  - query: |
      SELECT Path, Line, Rule, Severity, Message
      FROM chain(a01=R001, a02=R002, a03=R003, a04=R004, a05=R005, a06=R006, a08=R008, a09=R009, a10=R010,
                 a11=R011, a12=R012, a20=R020, a21=R020dup, a23=R023, a24=R024, a26=R026,
                 a30=R030, a31=R030shape, a32=R030dup, a33=R030map, a35=R035, a36=R036, a42=R042,
                 a50=R050, a51=R051, a52=R052, a53=R053, a60=R060, a61=R061, a62=R062,
                 a80=R080, a81=R081, a82=R082, a84=R084)
      ORDER BY Path
