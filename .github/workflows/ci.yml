name: CI

# The pull-request gate: yamllint, then the Go linter plus everything the pinned
# Velociraptor release checks (the verifier and the smoke). Every job checks out
# the upstream submodules recursively (the dependency universe) and runs the same
# `make` targets a contributor runs locally. `all_green` is the one status check
# branch protection requires. The Go toolchain is provided by the runner (with
# GOTOOLCHAIN=auto fetching the pinned version if needed).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/requirements/python.txt

      - name: Install Python tooling
        run: make deps

      - name: YAML style
        run: make yamllint

  verify:
    name: lint, verify, smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache the pinned Velociraptor binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/velociraptor
          key: velociraptor-${{ runner.os }}-${{ hashFiles('.github/workflows/requirements/velociraptor.txt') }}

      - name: Build the Go linter
        run: make lint-bin

      - name: Artefact standard (Go linter)
        run: make lint

      - name: Linter regression test
        run: make lint-test

      - name: Native loadability and static analysis
        run: make verify

      - name: Smoke, every artefact on every host
        run: make smoke

  all_green:
    name: all_green
    if: ${{ always() }}
    needs: [lint, verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when any required job failed or was cancelled
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: ${results}"
          case "${results}" in
            *failure* | *cancelled*) exit 1 ;;
          esac
