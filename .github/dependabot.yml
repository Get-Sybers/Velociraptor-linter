version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /.github/workflows/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /linter
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns:
          - "*"
